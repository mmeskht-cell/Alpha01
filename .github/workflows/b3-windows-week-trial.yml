name: B3 First Week Windows Portable Playtest
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - '.github/workflows/b3-windows-week-trial.yml'

permissions:
  contents: read

jobs:
  b3-week-portable:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout exact public verified game
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify game tree matches public B3 dual-CI accepted source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code f43ddeba97da576bcea5726d4281e48f66375c46 HEAD -- game/
          if ($LASTEXITCODE -ne 0) { throw 'Public game differs from dual-CI accepted SHA' }
          Write-Host "B3_WINDOWS_GAME_TREE_MATCHES_PUBLIC_DUAL_CI"

      - name: Download and verify pinned Godot 4.7.2 Windows GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'godot_4.7.2_windows.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Pinned Godot archive SHA256 mismatch $actual" }
          $engineDir = Join-Path $env:RUNNER_TEMP 'godot-b3-windows'
          Expand-Archive -Path $archive -DestinationPath $engineDir -Force
          $console = Get-ChildItem $engineDir -Filter 'Godot_v4.7.2-stable_win64_console.exe' -Recurse | Select-Object -First 1
          $gui = Get-ChildItem $engineDir -Filter 'Godot_v4.7.2-stable_win64.exe' -Recurse | Select-Object -First 1
          if ($null -eq $console -or $null -eq $gui) { throw 'Godot 4.7.2 Win64 executables absent' }
          "GODOT_CONSOLE=$($console.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GODOT_GUI=$($gui.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $console.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Godot Windows engine version failed' }

      - name: Generate game runtime data and import assets on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python game/tools/prepare_runtime_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime assets unavailable' }
          python game/tools/localization.py
          if ($LASTEXITCODE -ne 0) { throw 'Localization validation failed' }
          & $env:GODOT_CONSOLE --headless --editor --path game --import 2>&1 | Tee-Object -FilePath b3-week-win-import.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows Godot import failed' }
          if (Select-String -Path b3-week-win-import.log -Pattern 'SCRIPT ERROR:|^ERROR:|^FAIL:' -Quiet) { throw 'Windows Godot import diagnostics' }

      - name: Windows exact first-week scene and combined seven-day runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:GODOT_CONSOLE --headless --path game res://scenes/app/alpha_b3_week_candidate.tscn --quit-after 10 2>&1 | Tee-Object -FilePath b3-week-win-scene.log
          if ($LASTEXITCODE -ne 0) { throw 'B3 first-week Windows scene startup failed' }
          if (Select-String -Path b3-week-win-scene.log -Pattern 'SCRIPT ERROR:|^ERROR:|^FAIL:' -Quiet) { throw 'Windows B3 scene diagnostics' }
          & $env:GODOT_CONSOLE --headless --path game --script res://tests/scenarios/alpha_b3_integrated_week_test.gd -- combined 2>&1 | Tee-Object -FilePath b3-week-win-combined.log
          if ($LASTEXITCODE -ne 0) { throw 'B3 combined seven-day Windows test failed' }
          if (-not (Select-String -Path b3-week-win-combined.log -Pattern 'ALPHA_B3_INTEGRATED_WEEK_PART combined: 1 checks, 0 failures' -Quiet)) { throw 'B3 combined scenario pass marker missing' }
          if (Select-String -Path b3-week-win-combined.log -Pattern 'SCRIPT ERROR:|^ERROR:|^FAIL:' -Quiet) { throw 'Windows combined scenario diagnostics' }
          Write-Host "B3_WEEK_WINDOWS_RUNTIME_SMOKE_OK source=$env:GITHUB_SHA"

      - name: Package keyboard and mouse Windows portable first-week game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'EXIT_NOT_INCLUDED_B3_Windows_Playtest'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item $env:GODOT_GUI (Join-Path $root 'Godot_v4.7.2-stable_win64.exe')
          Copy-Item game (Join-Path $root 'game') -Recurse
          foreach ($transient in @('editor', 'shader_cache')) {
            $cache = Join-Path $root ('game/.godot/' + $transient)
            if (Test-Path $cache) { Remove-Item $cache -Recurse -Force }
          }
          $nl = [Environment]::NewLine
          $launch = '@echo off' + $nl + 'cd /d "%~dp0"' + $nl + '"%~dp0Godot_v4.7.2-stable_win64.exe" --path "%~dp0game" res://scenes/app/alpha_b3_week_candidate.tscn' + $nl
          [IO.File]::WriteAllText((Join-Path $root 'Launch B3 Week.cmd'), $launch, [Text.Encoding]::ASCII)
          $compare = '@echo off' + $nl + 'cd /d "%~dp0"' + $nl + '"%~dp0Godot_v4.7.2-stable_win64.exe" --path "%~dp0game" res://scenes/app/alpha_b3_m7_interest.tscn' + $nl
          [IO.File]::WriteAllText((Join-Path $root 'Launch M7 Comparison.cmd'), $compare, [Text.Encoding]::ASCII)
          $readme = @(
            'EXIT NOT INCLUDED — B3 첫 주 Windows 플레이테스트',
            '',
            '1. ZIP을 모두 압축 해제하세요. 압축파일 안에서 직접 실행하지 마세요.',
            '2. Launch B3 Week.cmd 파일을 더블클릭하세요.',
            '3. 별도 Godot 설치는 필요 없습니다. 같은 폴더의 Godot 4.7.2 포터블 실행기를 사용합니다.',
            '4. 마우스와 키보드로 D1~D7 영업을 진행해 주세요. 이 빌드는 정식 출시판이 아닙니다.',
            '5. Launch M7 Comparison.cmd 는 이전 M7 체험용이며 B3와 별도 저장 슬롯을 사용합니다.',
            '',
            '[관찰할 핵심 경로]',
            'D1: G01 손님과 연락처 교환 → 영업 마감 → 저녁 연락처 선택 → 공구 회수 의뢰(출장비 10 VKC).',
            'D2: G04의 시계 WAT02 담보로 40 VKC 지급. 일반 매입과 비교해 보세요.',
            'D3: 의뢰 지연, 재고·구매자 방문 여부 확인.',
            'D4: 전당 45 VKC 상환 또는 1회 D6 무상 연장. G01 공구 귀환 시 매입 견적 60 VKC 확인.',
            'D5~D7: 재매입/판매, 실물 매대, NPC 재방문, 조건부 D7 G01 USD 견적을 확인.',
            '하루 고객 5~8명은 소프트 목표입니다. 재고·지갑이 부족하면 실제 방문 수가 적을 수 있습니다.',
            '',
            '[버그 제보]',
            '문제가 생기면 날짜, 손님/아이템, 클릭한 버튼, 기대한 결과와 실제 결과, 화면 해상도를 기록하세요.',
            '스크린샷은 Windows의 Win+Shift+S로 캡처할 수 있습니다.',
            '이 패키지는 Godot 실행기+소스를 묶은 포터블 개발자 시험판이며 독립 export된 정식 EXE가 아닙니다.',
            '기술 증거: 공개 CI SHA f43ddeba97da576bcea5726d4281e48f66375c46 full fixed와 native window 성공.',
            "포장 소스 커밋: $env:GITHUB_SHA",
            '기본 New Game 저장과 본 첫 주 시험 저장 슬롯은 분리됩니다.'
          ) -join $nl
          [IO.File]::WriteAllText((Join-Path $root 'README_B3_WEEK_KO.txt'), $readme, (New-Object System.Text.UTF8Encoding($true)))
          $notes = @(
            'B3 Windows 플레이테스트 기록',
            '실행 해상도:',
            'D1 실제 손님 수 / 매입 / 판매 / 감정 / 주요 문제:',
            'D2 실제 손님 수 / 전당 선택 / UI 이해도:',
            'D3 실제 손님 수 / 저녁 회수 결과:',
            'D4 실제 손님 수 / 담보 상환·연장 / 회수 매입:',
            'D5 실제 손님 수 / 매대·재고:',
            'D6 실제 손님 수 / 계약 종료:',
            'D7 실제 손님 수 / 결제통화·시장 반응:',
            '불편했던 화면·버튼 / 재현 방법 / 스크린샷:'
          ) -join $nl
          [IO.File]::WriteAllText((Join-Path $root 'B3_FEEDBACK_TEMPLATE.txt'), $notes, (New-Object System.Text.UTF8Encoding($true)))
          $output = Join-Path $env:GITHUB_WORKSPACE 'EXIT_NOT_INCLUDED_B3_Windows_Playtest.zip'
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $output -CompressionLevel Optimal -Force
          $zip = Get-Item $output
          $digest = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "B3_WINDOWS_PORTABLE_OK bytes=$($zip.Length) sha256=$digest public_source=$env:GITHUB_SHA"

      - name: Upload B3 first week Windows portable package and smoke logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b3-week-windows-playtest
          path: |
            EXIT_NOT_INCLUDED_B3_Windows_Playtest.zip
            b3-week-win-import.log
            b3-week-win-scene.log
            b3-week-win-combined.log
          if-no-files-found: warn
          retention-days: 7
