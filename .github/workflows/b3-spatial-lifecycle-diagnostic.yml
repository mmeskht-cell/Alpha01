name: B3 Spatial Lifecycle Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - '.github/workflows/b3-spatial-lifecycle-diagnostic.yml'
permissions:
  contents: read
concurrency:
  group: b3-spatial-lifecycle-diagnostic
  cancel-in-progress: false
jobs:
  b3-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 120 -o "$RUNNER_TEMP/godot.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
      - name: Inspect B3 object lifecycle without changing checked-in game
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/b3-test-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/b3-test-config"
          engine="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          python3 game/tools/prepare_runtime_assets.py
          "$engine" --headless --editor --path game --import --quit 2>&1 | tee /tmp/b3-import.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|^FAIL:' /tmp/b3-import.log; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game/tests/window/b3_spatial_week_window.gd')
          src = p.read_text()
          marker = '\tNode.print_orphan_nodes()\n\tcall_deferred("quit", 0 if failures == 0 else 1)'
          addition = '''\tprint("B3_EXIT_DIAGNOSTIC tweens=",get_processed_tweens().size(),
          \t\t" objects=", Performance.get_monitor(Performance.OBJECT_COUNT),
          \t\t" resources=",Performance.get_monitor(Performance.OBJECT_RESOURCE_COUNT))
          \tfor tween: Tween in get_processed_tweens():
          \t\tprint("B3_EXIT_TWEEN valid=",tween.is_valid(),
          \t\t\t" running=",tween.is_running(),
          \t\t\t" bound=",str(tween.get_bound_node()))
          \tNode.print_orphan_nodes()
          \tcall_deferred("quit", 0 if failures == 0 else 1)'''
          assert src.count(marker) == 1, 'expected isolated shutdown hook'
          p.write_text(src.replace(marker,addition))
          PY
          mkdir -p /tmp/b3-evidence
          LIBGL_ALWAYS_SOFTWARE=1 timeout 170s xvfb-run -a -s '-screen 0 1920x1080x24' "$engine" --path game --audio-driver Dummy --script res://tests/window/b3_spatial_week_window.gd -- /tmp/b3-evidence 2>&1 | tee /tmp/b3-lifecycle.log
          grep -E 'B3_SPATIAL_WEEK_WINDOW: [0-9]+ checks, 0 failures' /tmp/b3-lifecycle.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|^FAIL:|ObjectDB instances were leaked|Leaked instance:|resources still in use at exit' /tmp/b3-lifecycle.log; then exit 1; fi
