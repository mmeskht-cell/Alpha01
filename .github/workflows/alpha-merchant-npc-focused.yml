name: Alpha merchant NPC focused checks
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - '.github/workflows/alpha-merchant-npc-focused.yml'
      - 'game/tests/scenarios/merchant_office_ui_test.gd'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 120 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          mkdir -p /tmp/godot-alpha
          unzip -q /tmp/godot.zip -d /tmp/godot-alpha
          chmod +x /tmp/godot-alpha/Godot_v4.7.2-stable_linux.x86_64
      - name: Run isolated contract, negotiation and generated-visit checks
        shell: bash
        run: |
          set -euo pipefail
          python3 game/tools/prepare_runtime_assets.py
          python3 game/tools/localization.py
          engine=/tmp/godot-alpha/Godot_v4.7.2-stable_linux.x86_64
          "$engine" --headless --editor --path game --import 2>&1 | tee alpha-import.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|^FAIL:' alpha-import.log; then exit 1; fi
          for test in calendar_merchant_contracts_test npc_bargaining_policy_test npc_generated_visits_test merchant_office_ui_test; do
            "$engine" --headless --path game --script "res://tests/scenarios/$test.gd" 2>&1 | tee "$test.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:|^FAIL:' "$test.log"; then exit 1; fi
          done
      - name: Preserve focused logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-merchant-npc-focused
          path: |
            alpha-import.log
            calendar_merchant_contracts_test.log
            npc_bargaining_policy_test.log
            npc_generated_visits_test.log
            merchant_office_ui_test.log
          if-no-files-found: warn
          retention-days: 3
